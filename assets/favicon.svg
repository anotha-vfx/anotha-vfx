<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="3" fill="#0a0a0a"/>
  <!-- Gold "A" mark -->
  <text
    x="16" y="22"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="20" font-weight="900"
    fill="#c9a96e"
    text-anchor="middle"
    letter-spacing="-0.5">A</text>
  <!-- Thin gold underline — like a film slate rule -->
  <rect x="7" y="26" width="18" height="1.2" rx=".6" fill="#c9a96e" opacity=".45"/>
</svg>
